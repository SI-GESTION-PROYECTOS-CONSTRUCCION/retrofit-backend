spring.application.name=backend
server.servlet.context-path=/api/v1

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

spring.servlet.multipart.max-file-size=15MB

spring.servlet.multipart.max-request-size=50MB

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

aws.spaces.endpoint=${SPACES_ENDPOINT}
aws.spaces.region=${SPACES_REGION}
aws.spaces.bucket=${SPACES_BUCKET}
aws.spaces.key=${SPACES_KEY}
aws.spaces.secret=${SPACES_SECRET}

# Credenciales de Administradores Iniciales (DataInitializer)
app.security.initial-admin-username=${INITIAL_ADMIN_USERNAME}
app.security.initial-admin-email=${INITIAL_ADMIN_EMAIL}
app.security.initial-admin-password=${INITIAL_ADMIN_PASSWORD}

app.security.initial-superadmin-username=${INITIAL_SUPERADMIN_USERNAME}
app.security.initial-superadmin-email=${INITIAL_SUPERADMIN_EMAIL}
app.security.initial-superadmin-password=${INITIAL_SUPERADMIN_PASSWORD}

# --- CORREO (SMTP) ---
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configuración de URLs y remitente
app.mail.from=${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:noreply@retrofit.com}}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}
# --- POOL DE CONEXIONES (HIKARI) ---
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
