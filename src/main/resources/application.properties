spring.application.name=backend
server.servlet.context-path=/api/v1

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

spring.servlet.multipart.max-file-size=15MB

spring.servlet.multipart.max-request-size=50MB

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

aws.spaces.endpoint=${SPACES_ENDPOINT}
aws.spaces.region=${SPACES_REGION}
aws.spaces.bucket=${SPACES_BUCKET}
aws.spaces.key=${SPACES_KEY}
aws.spaces.secret=${SPACES_SECRET}

# Credenciales de Administradores Iniciales (DataInitializer)
app.security.initial-admin-username=${INITIAL_ADMIN_USERNAME}
app.security.initial-admin-email=${INITIAL_ADMIN_EMAIL}
app.security.initial-admin-password=${INITIAL_ADMIN_PASSWORD}

app.security.initial-superadmin-username=${INITIAL_SUPERADMIN_USERNAME}
app.security.initial-superadmin-email=${INITIAL_SUPERADMIN_EMAIL}
app.security.initial-superadmin-password=${INITIAL_SUPERADMIN_PASSWORD}

# --- CORREO TRANSACCIONAL (BREVO API - HTTPS PUERTO 443) ---
brevo.api.key=${BREVO_API_KEY:}
app.mail.from=${APP_MAIL_FROM:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}
# --- POOL DE CONEXIONES (HIKARI) ---
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# --- RATE LIMITING & THROTTLING (BUCKET4J / ISO 27001) ---
ratelimit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:5}
ratelimit.auth.refill-duration-seconds=${RATE_LIMIT_AUTH_REFILL_SECONDS:60}
ratelimit.api.capacity=${RATE_LIMIT_API_CAPACITY:100}
ratelimit.api.refill-duration-seconds=${RATE_LIMIT_API_REFILL_SECONDS:60}

