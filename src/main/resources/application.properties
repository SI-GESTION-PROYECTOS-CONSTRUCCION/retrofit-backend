spring.application.name=backend
server.servlet.context-path=/api/v1

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

spring.servlet.multipart.max-file-size=15MB

spring.servlet.multipart.max-request-size=50MB

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

aws.spaces.endpoint=${SPACES_ENDPOINT}
aws.spaces.region=${SPACES_REGION}
aws.spaces.bucket=${SPACES_BUCKET}
aws.spaces.key=${SPACES_KEY}
aws.spaces.secret=${SPACES_SECRET}

# Credenciales de Administradores Iniciales (DataInitializer)
app.security.initial-admin-username=${INITIAL_ADMIN_USERNAME}
app.security.initial-admin-email=${INITIAL_ADMIN_EMAIL}
app.security.initial-admin-password=${INITIAL_ADMIN_PASSWORD}

app.security.initial-superadmin-username=${INITIAL_SUPERADMIN_USERNAME}
app.security.initial-superadmin-email=${INITIAL_SUPERADMIN_EMAIL}
app.security.initial-superadmin-password=${INITIAL_SUPERADMIN_PASSWORD}